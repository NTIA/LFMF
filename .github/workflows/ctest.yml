# This action compiles the library and driver and runs all unit tests using an OS and CMake matrix
name: Unit Tests

on:
  ## Currently disabled, use workflow_dispatch for manual triggering
  #push:
  #  branches: ["main"]
  #  paths:
  #    - 'CMakeLists.txt'
  #    - 'CMakePresets.json'
  #    - '.gitmodules'
  #    - '.github/workflows/ctest.yml'
  #    - 'app/**'
  #    - 'extern/**'
  #    - 'include/**'
  #    - 'src/**'
  #    - 'tests/**'
  #pull_request:
  #  branches: ["main"]
  #  paths:
  #    - 'CMakeLists.txt'
  #    - 'CMakePresets.json'
  #    - '.gitmodules'
  #    - '.github/workflows/ctest.yml'
  #    - 'app/**'
  #    - 'extern/**'
  #    - 'include/**'
  #    - 'src/**'
  #    - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Define the matrix for different operating systems
jobs:
  should-run:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Skip duplicate runs for merged PRs
        id: decide
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('should_run', 'true');
              return;
            }

            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            const hasMainPullRequest = pullRequests.some((pullRequest) => pullRequest.base.ref === 'main');
            core.setOutput('should_run', hasMainPullRequest ? 'false' : 'true');

  build-and-test:
    if: ${{ needs.should-run.outputs.should_run == 'true' }}
    needs: should-run
    name: ${{ matrix.platform.os }} / ${{ matrix.platform.architecture }} / CMake ${{ matrix.cmakeVersion }}
    runs-on: ${{ matrix.platform.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.platform.os }}-${{ matrix.platform.architecture }}-${{ matrix.cmakeVersion }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # `platform` bundles os + architecture as one dimension so it can be crossed
        # with cmakeVersion and pruned with a single `exclude`.
        #   - CMake versions test the minimum supported ("3.21.0") and current stable ("4.4.2").
        #   - windows-2025 (Visual Studio 2026) requires CMake >= 4.2, so 3.21.0 is excluded.
        # TODO-TEMPLATE: add a "windows-2022" (Visual Studio 2022) platform here if needed.
        platform:
          - { os: ubuntu-24.04,   architecture: x64 }    # Linux x64
          - { os: macos-15,       architecture: arm64 }  # Apple silicon, current stable release
          - { os: macos-15-intel, architecture: x64 }    # Intel, current stable release
          - { os: windows-2025,   architecture: x64 }    # Visual Studio 2026, current stable (CMake >= 4.2)
          - { os: windows-2025,   architecture: x86 }
        cmakeVersion: ["3.21.0", "4.4.2"]
        exclude:
          # windows-2025 (Visual Studio 2026) requires CMake >= 4.2
          - platform: { os: windows-2025, architecture: x64 }
            cmakeVersion: "3.21.0"
          - platform: { os: windows-2025, architecture: x86 }
            cmakeVersion: "3.21.0"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Clone required submodules
      run: |
        git submodule init extern/googletest
        git submodule init extern/test-data
        git submodule update

    - name: Install CMake
      uses: lukka/get-cmake@v4.4.2
      with:
        cmakeVersion: ${{ matrix.cmakeVersion }}

    - name: "CMake: Build and Test (64-bit)"
      if: matrix.platform.architecture != 'x86'
      uses: lukka/run-cmake@v10
      with:
        configurePreset: release64
        configurePresetAdditionalArgs: "['-DBUILD_DOCS=OFF']"
        buildPreset: release64
        testPreset: release64

    - name: "CMake: Build and Test (32-bit)"
      if: matrix.platform.architecture == 'x86'
      uses: lukka/run-cmake@v10
      with:
        configurePreset: release32
        configurePresetAdditionalArgs: "['-DBUILD_DOCS=OFF']"
        buildPreset: release32
        testPreset: release32
