# This action builds **AND DEPLOYS** Doxygen documentation to GitHub Pages
# Doxygen site is DEPLOYED if this action is triggered by publishing a release.
# Doxygen site is NOT DEPLOYED (only built) when triggered by pull request or manual dispatch.
name: C++ Docs

on:
  release:
    types: ["published"]
  pull_request:
    branches: ["main"]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.gitmodules'
      - '.github/workflows/doxygen.yml'
      - 'docs/**'
      - 'include/**'
      - 'src/**'
      - 'extern/doxygen-awesome-css/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'release' && 'release' || github.ref }}-docs-build
      cancel-in-progress: ${{ github.event_name != 'release' }}
    steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        - name: Clone doxygen-awesome-css submodule
          run: |
            git -c protocol.version=2 submodule update --init --depth 1 extern/doxygen-awesome-css

        - name: Install Doxygen
          uses: ssciwr/doxygen-install@v2
          with:
            version: "1.17.0"

        - name: Setup GitHub Pages
          if: ${{ github.event_name == 'release' }}
          id: pages
          uses: actions/configure-pages@v6

        - name: Install CMake
          uses: lukka/get-cmake@latest

        - name: Build documentation with Doxygen
          uses: lukka/run-cmake@v10
          with:
            configurePreset: docsOnly
            buildPreset: docsOnly

        - name: Upload GitHub Pages artifact
          uses: actions/upload-pages-artifact@v5
          if: ${{ github.event_name == 'release' }}
          with:
            path: ./docs/html/

  deploy:
    if: ${{ github.event_name == 'release' }}
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
